[project]
name = "harborguard-backend"
version = "0.1.0"
description = "Reproducible harbor security and disaster recovery demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
  "numpy>=2,<3", "shapely>=2,<3", "PyYAML>=6,<7", "Pillow>=10,<13",
  "opencv-python-headless>=4.10,<5", "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "websockets>=13,<17", "ruff>=0.9,<1", "psutil>=6,<8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
